name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build minified release APKs
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect release APKs
        shell: bash
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} release-artifacts/ \;
          test -n "$(find release-artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chumpy-release-apks-${{ github.run_number }}
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chumpy build ${{ github.run_number }}
          generate_release_notes: true
          files: release-artifacts/*.apk
